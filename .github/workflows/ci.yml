name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate complexity report
        run: |
          mkdir -p .tmp
          npm run analyze:complexity -- src --json-out .tmp/complexity-report.json

      - name: Complexity threshold warnings
        run: npm run check:complexity-thresholds -- --report .tmp/complexity-report.json

      - name: Enforce complexity thresholds on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run check:complexity-thresholds -- --report .tmp/complexity-report.json --enforce

      - name: Run checks
        run: npm run check

      - name: Verify coverage report
        run: test -s coverage/lcov.info

      - name: Upload coverage to Codacy
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          api-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage/lcov.info

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate complexity report
        run: |
          mkdir -p .tmp
          npm run analyze:complexity -- src --json-out .tmp/complexity-report.json

      - name: Complexity threshold warnings
        run: npm run check:complexity-thresholds -- --report .tmp/complexity-report.json

      - name: Enforce complexity thresholds on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run check:complexity-thresholds -- --report .tmp/complexity-report.json --enforce

      - name: Run checks
        run: npm run check

      - name: Verify installed npm package with fixtures
        run: npm run check:package:smoke

      - name: Verify Inspector with fixtures
        run: npm run mcp:inspect:smoke

      - name: Verify coverage report
        run: test -s coverage/lcov.info

      - name: Upload coverage to Codacy
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          coverage-reports: coverage/lcov.info

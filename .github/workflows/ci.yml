name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6

      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate complexity report
        run: |
          mkdir -p .tmp
          npm run analyze:complexity -- src --json-out .tmp/complexity-report.json

      - name: Complexity threshold warnings
        run: npm run check:complexity-thresholds -- --report .tmp/complexity-report.json

      - name: Enforce complexity thresholds on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run check:complexity-thresholds -- --report .tmp/complexity-report.json --enforce

      - name: Run checks
        run: npm run check
